name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit and mocked workflow tests
        run: python -m unittest discover -s tests -v
      - name: Build source archives
        run: python scripts/build_release.py --output "${{ runner.temp }}/gene-v1-release"
      - uses: actions/upload-artifact@v4
        with:
          name: gene-annotation-v1-source
          path: ${{ runner.temp }}/gene-v1-release/*
